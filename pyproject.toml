[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-zero-trust"
version = "0.1.0"
description = "Deterministic control plane for LLM agents in banking: Cedar policies, intent-bound tokens, provenance, hash-bound human approval, tamper-evident audit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cedarpy>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
llm = ["anthropic>=0.40"]
# agentdojo 0.1.x passes `temperature` to messages.stream(), which anthropic 1.x removed
agentdojo = ["agentdojo>=0.1.35", "anthropic<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the top-level `evals` package with plain `pytest`

[tool.ruff]
line-length = 110
src = ["src", "tests", "evals", "examples", "integrations"]
